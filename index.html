<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Blaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05060f;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8ecff;
  }
  #wrap { position: relative; }
  canvas {
    display: block; background: #0a0d1f;
    border: 2px solid #2a3170; border-radius: 8px;
    max-width: 100vw; max-height: 100vh;
    touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; background: rgba(5, 6, 15, 0.78); border-radius: 8px;
  }
  #overlay.hidden { display: none; }
  h1 { font-size: 44px; letter-spacing: 3px; color: #7cf3ff; text-shadow: 0 0 18px #2bd4ff; }
  p { color: #aab3e0; line-height: 1.6; }
  button {
    margin-top: 8px; padding: 12px 34px; font-size: 18px; font-weight: 600;
    background: #2bd4ff; color: #05060f; border: none; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #7cf3ff; }
  button.secondary { background: transparent; color: #7cf3ff; border: 2px solid #2bd4ff; padding: 10px 30px; font-size: 16px; }
  button.secondary:hover { background: #2bd4ff22; }
  .panel {
    position: absolute; inset: 0; padding: 28px 24px;
    display: flex; flex-direction: column; align-items: stretch; justify-content: safe center; gap: 18px;
    background: rgba(5, 6, 15, 0.9); border-radius: 8px; overflow-y: auto; /* short windows: scroll, don't clip */
  }
  .panel.hidden { display: none; }
  .panel h2 { text-align: center; font-size: 30px; letter-spacing: 3px; color: #7cf3ff; text-shadow: 0 0 14px #2bd4ff; }
  .panel > button { align-self: center; }
  #scoreList { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  #scoreList li {
    display: grid; grid-template-columns: 32px 1fr auto; align-items: baseline; gap: 10px;
    padding: 10px 14px; background: #141936; border: 1px solid #2a3170; border-radius: 6px;
  }
  #scoreList li.latest { border-color: #2bd4ff; }
  #scoreList .rank { color: #8a93c0; font-weight: 600; }
  #scoreList .pts { font-size: 20px; font-weight: 700; color: #e8ecff; }
  #scoreList .meta { font-size: 12px; color: #8a93c0; text-align: right; }
  #scoreList .empty { display: block; text-align: center; color: #6b739c; }
  .setting-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: #8a93c0; margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    flex: 1 1 0; margin: 0; padding: 8px 6px; font-size: 14px; font-weight: 600;
    background: #141936; color: #aab3e0; border: 1px solid #2a3170; border-radius: 6px; white-space: nowrap;
  }
  .seg button:hover { background: #1d2450; }
  .seg button.active { background: #2bd4ff; color: #05060f; border-color: #2bd4ff; }
  .seg.maps button { flex-basis: 45%; }
  .hint { font-size: 12px; color: #6b739c; margin-top: 4px; }
  .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  #hangar {
    position: absolute; inset: 0; padding: 16px 14px;
    display: flex; flex-direction: column; align-items: stretch; justify-content: safe center; gap: 8px;
    background: rgba(5, 6, 15, 0.92); border-radius: 8px; overflow-y: auto;
  }
  #hangar.hidden { display: none; }
  #hangar h2 { text-align: center; font-size: 28px; letter-spacing: 3px; color: #7cf3ff; text-shadow: 0 0 14px #2bd4ff; }
  #shipGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ship-card {
    margin: 0; padding: 6px 8px; font-size: 12px; font-weight: 400; text-align: left;
    background: #141936; color: #aab3e0; border: 1px solid #2a3170; border-radius: 6px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .ship-card:hover { background: #1d2450; }
  .ship-card.active { border: 2px solid #2bd4ff; background: #12284a; }
  .ship-card.locked { opacity: 0.55; cursor: not-allowed; }
  .ship-card.locked:hover { background: #141936; }
  .ship-head { display: flex; align-items: center; gap: 8px; }
  .ship-head canvas { border: none; border-radius: 4px; background: #0a0d1f; flex: none; }
  .ship-name { font-size: 15px; font-weight: 700; color: #e8ecff; }
  .ship-tag { font-size: 11px; color: #6b739c; }
  .ship-card.active .ship-tag { color: #7cf3ff; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8a93c0; }
  .stat span { width: 62px; flex: none; white-space: nowrap; }
  .bar { flex: 1; height: 5px; background: #ffffff1a; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #7cf3ff; }
  #shipDesc { text-align: center; font-size: 13px; color: #aab3e0; min-height: 18px; }
  #closeHangar { align-self: center; margin-top: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="overlay">
    <h1 id="title">STAR BLASTER</h1>
    <p id="msg">
      Move: <b>← →</b> / <b>A D</b> (or drag on touch)<br>
      Shoot: <b>Space</b> (auto-fire on touch)<br>
      Pause: <b>P</b>
    </p>
    <button id="startBtn">Start Game</button>
    <div class="btn-row">
      <button id="hangarBtn" class="secondary">Hangar</button>
      <button id="scoresBtn" class="secondary">High Scores</button>
      <button id="settingsBtn" class="secondary">Settings</button>
    </div>
  </div>
  <div id="hangar" class="hidden">
    <h2>HANGAR</h2>
    <div id="shipGrid"></div>
    <div id="shipDesc"></div>
    <button id="closeHangar">Back</button>
  </div>
  <div id="scores" class="panel hidden">
    <h2>HIGH SCORES</h2>
    <ol id="scoreList"></ol>
    <button id="closeScores">Back</button>
  </div>
  <div id="settings" class="panel hidden">
    <h2>SETTINGS</h2>
    <div>
      <div class="setting-label">Map</div>
      <div class="seg maps" data-key="map"></div>
    </div>
    <div>
      <div class="setting-label">Change map each level</div>
      <div class="seg" data-key="cycleMaps"></div>
    </div>
    <div>
      <div class="setting-label">Difficulty</div>
      <div class="seg" data-key="difficulty"></div>
      <div class="hint">Starting lives apply from the next game.</div>
    </div>
    <div>
      <div class="setting-label">Auto-fire (keyboard)</div>
      <div class="seg" data-key="autoFire"></div>
    </div>
    <button id="closeSettings">Back</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');

let highScore = 0;
try { highScore = +localStorage.getItem('starBlasterHigh') || 0; } catch (e) {}

// ---------- Top scores ----------
// Top 5 runs on this device, best first: { score, level, difficulty }.
const TOP_N = 5;
let topScores = [];
let latestEntry = null; // the entry added by the most recent run, highlighted in the list
try {
  const saved = JSON.parse(localStorage.getItem('starBlasterScores') || '[]');
  if (Array.isArray(saved)) {
    topScores = saved
      .filter(s => s && Number.isFinite(s.score) && s.score > 0 && (s.level === null || Number.isFinite(s.level)))
      .map(s => ({ score: s.score, level: s.level, difficulty: s.difficulty }))
      .sort((a, b) => b.score - a.score).slice(0, TOP_N);
  }
} catch (e) {}
// players from before the list existed keep their best score
if (!topScores.length && highScore > 0) topScores = [{ score: highScore, level: null, difficulty: null }];
if (topScores.length) highScore = Math.max(highScore, topScores[0].score);

function recordScore(score, level, difficulty) {
  if (score <= 0) return;
  const entry = { score, level, difficulty };
  topScores.push(entry);
  topScores.sort((a, b) => b.score - a.score);
  topScores = topScores.slice(0, TOP_N);
  latestEntry = topScores.includes(entry) ? entry : null;
  try { localStorage.setItem('starBlasterScores', JSON.stringify(topScores)); } catch (e) {}
}

// ---------- Settings ----------
const MAPS = {
  space:     'Deep Space',
  nebula:    'Nebula',
  asteroids: 'Asteroid Field',
  grid:      'Cyber Grid',
};
const MAP_KEYS = Object.keys(MAPS);
const DIFFICULTY = {
  easy:   { label: 'Easy',   speed: 0.8,  spawn: 1.3,  lives: 5 },
  normal: { label: 'Normal', speed: 1,    spawn: 1,    lives: 3 },
  hard:   { label: 'Hard',   speed: 1.25, spawn: 0.75, lives: 2 },
};
// Player ships. Falcon is the original ship and must keep these exact stats (they are the
// documented baseline). All ships stay in cyan/blue tones: cyan means "the player".
//   speed: px/s · cooldown: s between shots · damage: hp per bullet · hitR: hit radius
//   guns: x offsets of the barrels · invuln: s of invulnerability after a hit · unlock: high score needed
const SHIPS = {
  falcon: {
    name: 'Falcon', desc: 'All-rounder. The ship every pilot starts with.',
    speed: 320, cooldown: 0.18, damage: 1, bulletSpeed: 600, hitR: 14, guns: [0], invuln: 2, unlock: 0,
    color: '#7cf3ff', glow: '#2bd4ff', w: 34,
    pts: [[0, -19], [17, 16], [6, 10], [-6, 10], [-17, 16]], flames: [0], cockpit: [0, -2],
  },
  dart: {
    name: 'Dart', desc: 'Very fast with a tiny hitbox, but fires slowly.',
    speed: 430, cooldown: 0.24, damage: 1, bulletSpeed: 650, hitR: 10, guns: [0], invuln: 2, unlock: 300,
    color: '#c8f6ff', glow: '#7cf3ff', w: 20,
    pts: [[0, -24], [9, 16], [0, 10], [-9, 16]], flames: [0], cockpit: [0, -4],
  },
  twin: {
    name: 'Twin', desc: 'Two parallel cannons. Wider, so easier to hit.',
    speed: 290, cooldown: 0.24, damage: 1, bulletSpeed: 600, hitR: 16, guns: [-11, 11], invuln: 2, unlock: 600,
    color: '#5ce1e6', glow: '#1fb5c4', w: 38,
    pts: [[0, -12], [6, 2], [13, -16], [19, 16], [-19, 16], [-13, -16], [-6, 2]], flames: [-12, 12], cockpit: [0, 4],
  },
  bulwark: {
    name: 'Bulwark', desc: 'Slow and big, but every shot deals double damage.',
    speed: 240, cooldown: 0.3, damage: 2, bulletSpeed: 520, hitR: 18, guns: [0], invuln: 2, unlock: 1000,
    color: '#4d9fff', glow: '#2b6cff', w: 42,
    pts: [[-10, -18], [10, -18], [21, 2], [15, 16], [-15, 16], [-21, 2]], flames: [-8, 8], cockpit: [0, -4],
  },
  stinger: {
    name: 'Stinger', desc: 'Rapid fire with fast bullets. Hard to steer.',
    speed: 270, cooldown: 0.11, damage: 1, bulletSpeed: 760, hitR: 14, guns: [0], invuln: 2, unlock: 1600,
    color: '#9be7ff', glow: '#3fc6ff', w: 30,
    pts: [[-5, -22], [0, -12], [5, -22], [15, 14], [0, 8], [-15, 14]], flames: [0], cockpit: [0, -2],
  },
  phantom: {
    name: 'Phantom', desc: 'Stays invulnerable longer after each hit.',
    speed: 340, cooldown: 0.2, damage: 1, bulletSpeed: 620, hitR: 13, guns: [0], invuln: 3.5, unlock: 2500,
    color: '#a0c4ff', glow: '#6b8cff', w: 40,
    pts: [[0, -16], [21, 14], [8, 9], [0, 14], [-8, 9], [-21, 14]], flames: [-6, 6], cockpit: [0, -1],
  },
};
const isUnlocked = key => highScore >= SHIPS[key].unlock;

const SETTING_OPTIONS = {
  map: MAPS,
  cycleMaps: { false: 'Off', true: 'On' },
  difficulty: Object.fromEntries(Object.entries(DIFFICULTY).map(([k, v]) => [k, v.label])),
  autoFire: { false: 'Off', true: 'On' },
  ship: Object.fromEntries(Object.entries(SHIPS).map(([k, v]) => [k, v.name])),
};
const settings = { map: 'space', cycleMaps: 'false', difficulty: 'normal', autoFire: 'false', ship: 'falcon' };
try {
  const saved = JSON.parse(localStorage.getItem('starBlasterSettings') || '{}');
  for (const k in settings) if (saved[k] in SETTING_OPTIONS[k]) settings[k] = saved[k];
} catch (e) {}
// a saved ship can become locked again if the high score was cleared
if (!isUnlocked(settings.ship)) settings.ship = 'falcon';
const saveSettings = () => { try { localStorage.setItem('starBlasterSettings', JSON.stringify(settings)); } catch (e) {} };

const settingsEl = document.getElementById('settings');
const settingsBtn = document.getElementById('settingsBtn');
let openPanel = null; // the Settings, High Scores or Hangar panel while it is showing

function renderSettings() {
  for (const seg of settingsEl.querySelectorAll('.seg')) {
    const key = seg.dataset.key;
    seg.innerHTML = '';
    for (const [value, label] of Object.entries(SETTING_OPTIONS[key])) {
      const b = document.createElement('button');
      b.textContent = label;
      if (settings[key] === value) b.classList.add('active');
      b.addEventListener('click', () => {
        settings[key] = value;
        saveSettings();
        renderSettings();
        if (state !== 'menu') draw(); // menu redraws itself; refresh the frozen frame otherwise
      });
      seg.appendChild(b);
    }
  }
}
const scoresEl = document.getElementById('scores');
const scoreListEl = document.getElementById('scoreList');

function renderScores() {
  scoreListEl.innerHTML = '';
  if (!topScores.length) {
    scoreListEl.innerHTML = '<li class="empty">No scores yet — play a game!</li>';
    return;
  }
  topScores.forEach((s, i) => {
    const li = document.createElement('li');
    if (s === latestEntry) li.classList.add('latest');
    const meta = [s.level ? `Level ${s.level}` : '', DIFFICULTY[s.difficulty]?.label || ''].filter(Boolean).join(' · ');
    li.innerHTML = `<span class="rank">#${i + 1}</span><span class="pts">${s.score}</span><span class="meta"></span>`;
    li.querySelector('.meta').textContent = meta;
    scoreListEl.appendChild(li);
  });
}

// Settings, High Scores and Hangar are full-screen panels; only one is open at a time.
function showPanel(el) {
  openPanel = el;
  if (el === settingsEl) renderSettings();
  else if (el === scoresEl) renderScores();
  else renderHangar();
  overlay.classList.add('hidden');
  el.classList.remove('hidden');
}
function closePanel() {
  if (!openPanel) return;
  openPanel.classList.add('hidden');
  openPanel = null;
  overlay.classList.remove('hidden');
}
settingsBtn.addEventListener('click', () => showPanel(settingsEl));
document.getElementById('scoresBtn').addEventListener('click', () => showPanel(scoresEl));
document.getElementById('closeSettings').addEventListener('click', closePanel);
document.getElementById('closeScores').addEventListener('click', closePanel);

// ---------- Hangar (ship selection) ----------
const hangarEl = document.getElementById('hangar');
const hangarBtn = document.getElementById('hangarBtn');
const shipGrid = document.getElementById('shipGrid');
const shipDesc = document.getElementById('shipDesc');

// stat bars, normalised against the best ship in each stat
const SHIP_LIST = Object.values(SHIPS);
const maxOf = f => Math.max(...SHIP_LIST.map(f));
const dps = s => s.guns.length * s.damage / s.cooldown;
const STATS = [
  ['Speed',     s => s.speed / maxOf(t => t.speed)],
  ['Fire rate', s => (1 / s.cooldown) / maxOf(t => 1 / t.cooldown)],
  ['Damage',    s => dps(s) / maxOf(dps)],
  ['Evasion',   s => 1 - (s.hitR - 8) / 12], // smaller hitbox = harder to hit
];

function renderHangar() {
  shipGrid.innerHTML = '';
  for (const [key, s] of Object.entries(SHIPS)) {
    const unlocked = isUnlocked(key);
    const card = document.createElement('button');
    card.className = 'ship-card' + (settings.ship === key ? ' active' : '') + (unlocked ? '' : ' locked');
    const tag = !unlocked ? `🔒 Score ${s.unlock} to unlock` : settings.ship === key ? 'Selected' : 'Available';
    card.innerHTML = `
      <div class="ship-head">
        <canvas width="48" height="48"></canvas>
        <div><div class="ship-name">${s.name}</div><div class="ship-tag">${tag}</div></div>
      </div>
      ${STATS.map(([label, f]) => `<div class="stat"><span>${label}</span><div class="bar"><i style="width:${Math.round(Math.max(0.08, Math.min(1, f(s))) * 100)}%"></i></div></div>`).join('')}`;
    const pc = card.querySelector('canvas').getContext('2d');
    pc.save(); pc.scale(0.95, 0.95); drawShip(pc, 25, 22, s, unlocked); pc.restore();
    card.addEventListener('mouseenter', () => { shipDesc.textContent = s.desc; });
    card.addEventListener('mouseleave', () => { shipDesc.textContent = SHIPS[settings.ship].desc; });
    card.addEventListener('click', () => {
      if (!unlocked) { shipDesc.textContent = `${s.name} unlocks at a high score of ${s.unlock} (yours: ${highScore}).`; return; }
      settings.ship = key;
      saveSettings();
      renderHangar();
    });
    shipGrid.appendChild(card);
  }
  shipDesc.textContent = SHIPS[settings.ship].desc;
}
hangarBtn.addEventListener('click', () => showPanel(hangarEl));
document.getElementById('closeHangar').addEventListener('click', closePanel);

const diff = () => DIFFICULTY[settings.difficulty];
function currentMap() {
  if (settings.cycleMaps === 'true' && state !== 'menu' && level) return MAP_KEYS[(level - 1) % MAP_KEYS.length];
  return settings.map;
}

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  if (openPanel) {
    if (e.code === 'Escape') closePanel();
    return;
  }
  keys[e.code] = true;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && state === 'playing') togglePause();
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'playing' && state !== 'paused') startGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let touchX = null;
function canvasX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointerdown', e => { touchX = canvasX(e.clientX); });
canvas.addEventListener('pointermove', e => { if (touchX !== null) touchX = canvasX(e.clientX); });
addEventListener('pointerup', () => { touchX = null; });

// ---------- Game state ----------
let state = 'menu';
let player, bullets, enemies, enemyBullets, particles, powerups, stars;
let score, lives, level, spawnTimer, shootCooldown, invuln, lastTime, levelTimer, startHigh;

stars = Array.from({ length: 80 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  s: Math.random() * 2 + 0.5, v: Math.random() * 60 + 20
}));

// ---------- Backgrounds ----------
let bgTime = 0;
const nebulaClouds = Array.from({ length: 7 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: 120 + Math.random() * 160, v: 8 + Math.random() * 12,
  hue: [275, 310, 200, 330][Math.floor(Math.random() * 4)],
}));
function makeAsteroid(y) {
  const r = 10 + Math.random() * 34, n = 7 + Math.floor(Math.random() * 4);
  return {
    x: Math.random() * W, y: y ?? -r * 2, r,
    v: 15 + Math.random() * 35, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 0.8,
    pts: Array.from({ length: n }, (_, i) => [i / n * Math.PI * 2, r * (0.7 + Math.random() * 0.3)]),
  };
}
let asteroids = Array.from({ length: 12 }, () => makeAsteroid(Math.random() * H));

function updateBackground(dt) {
  bgTime += dt;
  for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (const c of nebulaClouds) {
    c.y += c.v * dt;
    if (c.y - c.r > H) { c.y = -c.r; c.x = Math.random() * W; }
  }
  for (const a of asteroids) { a.y += a.v * dt; a.rot += a.spin * dt; }
  asteroids = asteroids.map(a => a.y - a.r > H ? makeAsteroid() : a);
}

function drawStars(tint, alphaScale = 1) {
  for (const s of stars) {
    ctx.fillStyle = `rgba(${tint},${(s.s / 2.5) * alphaScale})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
}

function drawBackground() {
  const map = currentMap();
  if (map === 'nebula') {
    ctx.fillStyle = '#100820'; ctx.fillRect(0, 0, W, H);
    for (const c of nebulaClouds) {
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, `hsla(${c.hue},80%,55%,0.22)`);
      g.addColorStop(1, `hsla(${c.hue},80%,55%,0)`);
      ctx.fillStyle = g;
      ctx.fillRect(c.x - c.r, c.y - c.r, c.r * 2, c.r * 2);
    }
    drawStars('255,220,255');
  } else if (map === 'asteroids') {
    ctx.fillStyle = '#0c0a10'; ctx.fillRect(0, 0, W, H);
    drawStars('220,210,200', 0.6);
    // dim and desaturated so they read as scenery, not enemies
    ctx.fillStyle = '#2a2530'; ctx.strokeStyle = '#4a4252'; ctx.lineWidth = 2;
    for (const a of asteroids) {
      ctx.save();
      ctx.translate(a.x, a.y); ctx.rotate(a.rot);
      ctx.beginPath();
      for (const [ang, d] of a.pts) ctx.lineTo(Math.cos(ang) * d, Math.sin(ang) * d);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  } else if (map === 'grid') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05000f'); g.addColorStop(1, '#2a0838');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const step = 40, off = (bgTime * 80) % step;
    ctx.lineWidth = 1;
    for (let y = off - step; y < H; y += step) {
      ctx.strokeStyle = `rgba(255,60,200,${0.08 + 0.25 * (y / H)})`;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(60,220,255,0.14)';
    for (let x = 0; x <= W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#0a0d1f'; ctx.fillRect(0, 0, W, H);
    drawStars('200,210,255');
  }
}

function startGame() {
  const ship = SHIPS[isUnlocked(settings.ship) ? settings.ship : 'falcon'];
  player = { x: W / 2, y: H - 70, w: ship.w, h: 38, speed: ship.speed, spread: 0, ship };
  startHigh = highScore;
  bullets = []; enemies = []; enemyBullets = []; particles = []; powerups = [];
  score = 0; lives = diff().lives; level = 1;
  spawnTimer = 0; shootCooldown = 0; invuln = 2; levelTimer = 0;
  state = 'playing';
  overlay.classList.add('hidden');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    showOverlay('PAUSED', 'Press <b>P</b> to resume', null);
  } else if (state === 'paused') {
    state = 'playing';
    overlay.classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
}

function showOverlay(title, html, btnText) {
  titleEl.textContent = title;
  msgEl.innerHTML = html;
  startBtn.style.display = btnText ? '' : 'none';
  if (btnText) startBtn.textContent = btnText;
  hangarBtn.style.display = state === 'paused' ? 'none' : ''; // no ship swaps mid-run
  overlay.classList.remove('hidden');
}

function gameOver() {
  state = 'over';
  recordScore(score, level, settings.difficulty);
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('starBlasterHigh', highScore); } catch (e) {}
  }
  const newShips = SHIP_LIST.filter(s => s.unlock > startHigh && s.unlock <= highScore);
  const unlockMsg = newShips.length
    ? `<br><span style="color:#7cf3ff">New ship unlocked: <b>${newShips.map(s => s.name).join(', ')}</b>. Pick it in the Hangar!</span>`
    : '';
  showOverlay('GAME OVER',
    `Score: <b>${score}</b> &nbsp; Level: <b>${level}</b><br>High score: <b>${highScore}</b>${unlockMsg}`,
    'Play Again');
}

startBtn.addEventListener('click', startGame);

// ---------- Spawning ----------
const ENEMY_TYPES = [
  { name: 'scout',   hp: 1, r: 14, speed: 120, color: '#ff5c8a', points: 10, shoots: false },
  { name: 'zigzag',  hp: 2, r: 16, speed: 90,  color: '#ffb84d', points: 25, shoots: false },
  { name: 'gunner',  hp: 3, r: 20, speed: 60,  color: '#b46bff', points: 50, shoots: true },
];

function spawnEnemy() {
  const pool = level < 2 ? 1 : level < 4 ? 2 : 3;
  const t = ENEMY_TYPES[Math.floor(Math.random() * pool)];
  enemies.push({
    ...t,
    x: t.r + Math.random() * (W - t.r * 2), y: -t.r,
    baseX: 0, age: 0, maxHp: t.hp,
    speed: t.speed * (1 + (level - 1) * 0.12) * diff().speed,
    fireTimer: 1 + Math.random() * 1.5,
  });
  enemies[enemies.length - 1].baseX = enemies[enemies.length - 1].x;
}

function explode(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 220 + 40;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, color });
  }
}

// ---------- Update ----------
function update(dt) {
  updateBackground(dt);

  // level up every 20 seconds
  levelTimer += dt;
  if (levelTimer > 20) { levelTimer = 0; level++; }

  // player movement
  let dx = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (touchX !== null) {
    const diff = touchX - player.x;
    dx = Math.abs(diff) < 4 ? 0 : Math.sign(diff) * Math.min(1, Math.abs(diff) / 30);
  }
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x + dx * player.speed * dt));

  // shooting
  shootCooldown -= dt;
  if ((keys.Space || touchX !== null || settings.autoFire === 'true') && shootCooldown <= 0) {
    const s = player.ship;
    shootCooldown = s.cooldown;
    const angles = player.spread > 0 ? [-0.18, 0, 0.18] : [0];
    for (const gx of s.guns) {
      for (const a of angles) {
        bullets.push({
          x: player.x + gx, y: player.y - player.h / 2,
          vx: Math.sin(a) * s.bulletSpeed, vy: -Math.cos(a) * s.bulletSpeed, dmg: s.damage,
        });
      }
    }
  }
  if (player.spread > 0) player.spread -= dt;
  if (invuln > 0) invuln -= dt;

  bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  bullets = bullets.filter(b => b.y > -10 && b.x > -10 && b.x < W + 10);

  // enemies
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(0.3, 1.1 - level * 0.08) * (0.6 + Math.random() * 0.8) * diff().spawn;
  }
  for (const e of enemies) {
    e.age += dt;
    e.y += e.speed * dt;
    if (e.name === 'zigzag') e.x = e.baseX + Math.sin(e.age * 3) * 60;
    if (e.shoots) {
      e.fireTimer -= dt;
      if (e.fireTimer <= 0 && e.y > 0) {
        e.fireTimer = Math.max(0.8, 2 - level * 0.1);
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(ang) * 220, vy: Math.sin(ang) * 220 });
      }
    }
  }

  // bullet vs enemy
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 3) {
        e.hp -= b.dmg; b.y = -100;
        explode(b.x, b.y + 100, '#ffffff', 4);
        if (e.hp <= 0) {
          score += e.points;
          explode(e.x, e.y, e.color);
          if (Math.random() < 0.08) powerups.push({ x: e.x, y: e.y, type: Math.random() < 0.5 ? 'spread' : 'life' });
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b => b.y > -10);

  // enemies past bottom cost points
  for (const e of enemies) if (e.y - e.r > H && e.hp > 0) { e.hp = 0; score = Math.max(0, score - 5); }
  enemies = enemies.filter(e => e.hp > 0);

  enemyBullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  enemyBullets = enemyBullets.filter(b => b.y < H + 10 && b.y > -10 && b.x > -10 && b.x < W + 10);

  // powerups
  powerups.forEach(p => p.y += 110 * dt);
  powerups = powerups.filter(p => {
    if (Math.hypot(p.x - player.x, p.y - player.y) < 26) {
      if (p.type === 'spread') player.spread = 8; else lives = Math.min(5, lives + 1);
      explode(p.x, p.y, p.type === 'spread' ? '#4dff9a' : '#ff5c8a', 12);
      return false;
    }
    return p.y < H + 20;
  });

  // player hit
  if (invuln <= 0) {
    const hitR = player.ship.hitR;
    let hit = false;
    enemyBullets = enemyBullets.filter(b => {
      if (Math.hypot(b.x - player.x, b.y - player.y) < hitR + 4) { hit = true; return false; }
      return true;
    });
    for (const e of enemies) {
      if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + hitR) { hit = true; e.hp = 0; explode(e.x, e.y, e.color); }
    }
    enemies = enemies.filter(e => e.hp > 0);
    if (hit) {
      lives--;
      explode(player.x, player.y, '#7cf3ff', 30);
      invuln = player.ship.invuln;
      player.spread = 0;
      if (lives <= 0) { gameOver(); }
    }
  }

  // particles
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
}

// ---------- Draw ----------
// Draws a player ship on any 2D context (the game canvas or a Hangar preview).
function drawShip(c, x, y, ship, flame = true) {
  c.save();
  c.translate(x, y);
  if (flame) {
    c.fillStyle = Math.random() < 0.5 ? '#ffb84d' : '#ff5c2a';
    for (const fx of ship.flames) {
      c.beginPath(); c.moveTo(fx - 7, 16); c.lineTo(fx, 26 + Math.random() * 6); c.lineTo(fx + 7, 16); c.fill();
    }
  }
  c.fillStyle = ship.color;
  c.shadowColor = ship.glow; c.shadowBlur = 14;
  c.beginPath();
  for (const [px, py] of ship.pts) c.lineTo(px, py);
  c.closePath(); c.fill();
  c.shadowBlur = 0;
  c.fillStyle = '#05060f';
  c.beginPath(); c.ellipse(ship.cockpit[0], ship.cockpit[1], 4, 7, 0, 0, Math.PI * 2); c.fill();
  c.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = e.color;
  ctx.shadowColor = e.color; ctx.shadowBlur = 12;
  ctx.beginPath();
  if (e.name === 'scout') {
    ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r * 0.6); ctx.lineTo(-e.r, -e.r * 0.6);
  } else if (e.name === 'zigzag') {
    ctx.moveTo(0, e.r); ctx.lineTo(e.r, 0); ctx.lineTo(0, -e.r); ctx.lineTo(-e.r, 0);
  } else {
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2 + e.age;
      ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r);
    }
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  if (e.maxHp > 1) { // hp bar
    ctx.fillStyle = '#ffffff33'; ctx.fillRect(-e.r, -e.r - 8, e.r * 2, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(-e.r, -e.r - 8, e.r * 2 * (e.hp / e.maxHp), 3);
  }
  ctx.restore();
}

function draw() {
  drawBackground();
  if (state === 'menu') return;

  // bullets
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#7cf3ff'; ctx.shadowBlur = 8;
  for (const b of bullets) { const bw = b.dmg > 1 ? 7 : 4; ctx.fillRect(b.x - bw / 2, b.y - 8, bw, 12); }
  ctx.fillStyle = '#ff5c8a'; ctx.shadowColor = '#ff5c8a';
  for (const b of enemyBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.shadowBlur = 0;

  enemies.forEach(drawEnemy);

  // powerups
  for (const p of powerups) {
    ctx.fillStyle = p.type === 'spread' ? '#4dff9a' : '#ff5c8a';
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#05060f'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.type === 'spread' ? 'S' : '♥', p.x, p.y + 4);
  }

  // player (blink while invulnerable)
  if (lives > 0 && (invuln <= 0 || Math.floor(invuln * 10) % 2 === 0)) drawShip(ctx, player.x, player.y, player.ship);

  // particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 3, 3);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#e8ecff'; ctx.font = 'bold 18px Segoe UI, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText(`Score: ${score}`, 12, 26);
  ctx.textAlign = 'center'; ctx.fillText(`Level ${level}`, W / 2, 26);
  ctx.font = '12px Segoe UI, sans-serif'; ctx.fillStyle = '#8a93c0';
  ctx.fillText(MAPS[currentMap()], W / 2, 44);
  ctx.font = 'bold 18px Segoe UI, sans-serif';
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff5c8a';
  ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 12, 26);
  if (player.spread > 0) {
    ctx.fillStyle = '#4dff9a'; ctx.textAlign = 'left'; ctx.font = '14px Segoe UI, sans-serif';
    ctx.fillText(`Spread shot ${player.spread.toFixed(1)}s`, 12, 48);
  }
}

// ---------- Loop ----------
function loop(now) {
  if (state !== 'playing') { draw(); return; }
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  if (state === 'playing') requestAnimationFrame(loop);
}

// animated menu background
(function menuLoop() {
  if (state === 'menu') {
    updateBackground(1 / 60);
    draw();
    requestAnimationFrame(menuLoop);
  }
})();
</script>
